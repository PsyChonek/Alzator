name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Public repo: GitHub-hosted runner, never a self-hosted one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
