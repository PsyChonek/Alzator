<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(900px 500px at 85% 20%, rgba(74, 222, 128, 0.22), transparent 60%),
      radial-gradient(700px 500px at 10% 100%, rgba(59, 130, 246, 0.35), transparent 60%),
      linear-gradient(135deg, #0b1530 0%, #13265a 55%, #0b1530 100%);
    display: flex;
    align-items: center;
    padding: 0 64px;
    gap: 48px;
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .left { flex: 0 0 520px; position: relative; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 96px; height: 96px; filter: drop-shadow(0 10px 24px rgba(0,0,0,0.45)); }
  h1 { margin: 0; font-size: 84px; font-weight: 800; letter-spacing: -2px; }
  .tagline { margin: 28px 0 0; font-size: 34px; line-height: 1.25; font-weight: 600; }
  .tagline em { font-style: normal; color: #4ade80; }
  .sub { margin: 16px 0 0; font-size: 21px; color: #b8c4e0; line-height: 1.4; }
  .chips { display: flex; gap: 10px; margin-top: 30px; }
  .chip {
    font-weight: 700; font-size: 18px; padding: 8px 14px; border-radius: 999px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22);
  }
  .chip b { color: #4ade80; }
  .right { flex: 1; position: relative; display: flex; justify-content: center; }
  .shot {
    width: 600px; border-radius: 18px;
    transform: perspective(1400px) rotateY(-9deg) rotateX(3deg);
    box-shadow: 0 40px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08);
  }
  .badge {
    position: absolute; right: 8px; top: -26px;
    background: linear-gradient(180deg, #4ade80, #16a34a); color: #062b14;
    font-weight: 800; font-size: 26px; padding: 10px 18px; border-radius: 14px;
    transform: rotate(4deg); box-shadow: 0 14px 30px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="left">
    <div class="brand"><img src="logo.svg" alt=""><h1>Alzator</h1></div>
    <p class="tagline">Same product.<br>Five Alza shops.<br><em>One table in CZK.</em></p>
    <p class="sub">Anonymous, your own and AlzaPlus+ prices, with VAT, at the CNB rate. Regional variants included.</p>
    <div class="chips"><span class="chip"><b>CZ</b></span><span class="chip">SK</span><span class="chip">DE</span><span class="chip">AT</span><span class="chip">HU</span></div>
  </div>
  <div class="right">
    <img class="shot" src="screenshot-en.png" alt="">
    <div class="badge">-22.6 % in AT</div>
  </div>
</body>
</html>
